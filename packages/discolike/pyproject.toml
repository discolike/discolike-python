[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discolike"
dynamic = ["version"]
description = "Official Python SDK for the DiscoLike API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "DiscoLike", email = "support@discolike.com" }]
dependencies = [
  "httpx2>=2.9",
  "pydantic>=2.7",
  "typing-extensions>=4.1",
]
keywords = ["discolike", "sdk", "business-data", "enrichment"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.optional-dependencies]
cli = ["discolike-cli==0.2.0"]

[project.urls]
Homepage = "https://www.discolike.com"
Documentation = "https://docs.discolike.com"
Repository = "https://github.com/Discolike/discolike-python"
Changelog = "https://github.com/Discolike/discolike-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/Discolike/discolike-python/issues"

[tool.uv.sources]
discolike-testkit = { workspace = true }
discolike-cli = { workspace = true }

[tool.hatch.version]
path = "src/discolike/_version.py"

[dependency-groups]
dev = [
  "datamodel-code-generator>=0.75,<0.76",
  "discolike-testkit",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "ty",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
