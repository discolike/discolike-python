[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discolike"
dynamic = ["version"]
description = "Official Python SDK and CLI for the DiscoLike API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "DiscoLike", email = "support@discolike.com" }]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.0",
]
keywords = ["discolike", "sdk", "cli", "business-data", "enrichment"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://www.discolike.com"
Documentation = "https://docs.discolike.com"
Repository = "https://github.com/Discolike/discolike-python"

[tool.hatch.version]
path = "src/discolike/_version.py"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "ty",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID252"]
