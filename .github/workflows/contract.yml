---
name: contract
on:
    pull_request:
    schedule:
        - cron: 0 6 * * 1

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v5
              with:
                  python-version: '3.14'
            - run: uv sync --all-packages
            # SDK features land on development before the platform deploys to
            # prod, so PRs targeting development check against the dev spec.
            - env:
                  BASE_REF: ${{ github.base_ref }}
              run: |
                  if [ "$BASE_REF" = "development" ]; then
                      uv run python scripts/check_contract.py --spec-url https://api.dev.discolike.com/v1/openapi.json
                  else
                      uv run python scripts/check_contract.py
                  fi
