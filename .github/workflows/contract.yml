---
name: contract
on:
    pull_request:
    schedule:
        - cron: 0 6 * * 1

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v5
              with:
                  python-version: '3.14'
            - run: uv sync --all-groups
            - run: uv run python scripts/check_contract.py
