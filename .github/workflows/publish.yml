---
name: publish
on:
    release:
        types: [published]

jobs:
    publish-sdk:
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v5
              with:
                  python-version: '3.14'
            - run: uv build --package discolike -o dist/
            - uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  packages-dir: dist/
    publish-cli:
        runs-on: ubuntu-latest
        environment: pypi-cli
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v5
              with:
                  python-version: '3.14'
            - run: uv build --package discolike-cli -o dist/
            - uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  packages-dir: dist/
